body{min-height:100vh;min-height:100dvh;height:auto;display:flex;flex-direction:column}
main.page{flex:1 0 auto;width:100%}
.topbar{margin:0;border-width:0 0 1px;border-radius:0;min-height:0;position:sticky!important;top:0;bottom:auto;z-index:1030;padding-top:var(--safe-area-top)}
.topbar-in{display:flex;align-items:center;gap:14px;height:54px}

:focus-visible:not(.form-control){outline:2px solid #F34B7D!important;outline-offset:2px}

.brand-icon{flex:none;width:28px;height:28px;border-radius:0}
.topbar-brand:hover{color:var(--link);text-decoration:none}
.topbar-search{margin:0 0 0 auto;display:flex;flex:0 1 320px;min-width:0}

<body class="notranslate">
<nav class="navbar navbar-default topbar"><div class="container topbar-in">
<a class="topbar-brand" href="#"><img class="brand-icon" src="icon.png" alt="" width="28" height="28" onerror="this.style.display='none'"><span>raphetsoso's repository</span></a>
<form id="searchForm" class="topbar-search" action="#" role="search"><label for="s" class="sr-only">Search</label><input class="form-control" type="text" id="s" name="s" placeholder="Search..." autocomplete="off"><button type="submit" class="btn btn-default"><span class="sr-only">Search</span><span class="irucon irucon-search"></span></button></form>
</div></nav>
<main class="page"><div class="container">
<div id="home">
<h1 class="text-center"><span class="breakword">raphetsoso's repository</span> <a href="#" id="copyRss" title="Copy repo URL" role="button"><svg id="rssIcon" width="25" height="25" viewBox="0 0 16 16" fill="#f90" aria-label="Copy repo URL" style="vertical-align:middle"><circle cx="3" cy="13" r="1.6"/><path d="M1.5 6.5v2a6 6 0 0 1 6 6h2a8 8 0 0 0-8-8zM1.5 1.5v2a11 11 0 0 1 11 11h2a13 13 0 0 0-13-13z"/></svg></a></h1>
<div class="row"><div class="col-xs-12 col-sm-8 col-sm-offset-2">
<p class="text-center"><button type="button" id="copyRepo" class="btn btn-default btn-block repo-url active" title="Click to copy"><span id="copyLabel"></span></button></p>
<p class="text-center repo-add"><a id="sileo" href="#" rel="nofollow">Add to Sileo</a><a id="zebra" href="#" rel="nofollow">Add to Zebra</a></p>
</div></div>
<div id="results"></div>
<div class="row" id="empty" style="display:none"><div class="col-xs-12"><p class="text-center lead" id="emptyText">No result.</p></div></div>
<div class="text-center"><ul class="pagination pagination-md text-center"><li class="active"><span class="page-numbers current">1</span></li></ul></div><div class="lead text-center">1 / 1</div>
</div>
<div id="detail" hidden></div>
</div></main>
<footer class="navbar navbar-default navbar-static-bottom"><div class="container"><p class="footer-line text-center"><a href="https://discord.gg/pTjB39h9CX" target="_blank" rel="noopener">Contact</a><span>2026 © raphetsoso's repository</span></p></div></footer>
<div id="cookieChoiceInfo"><p>This website uses cookies to ensure you get the best experience.</p><button class="btn btn-primary" id="cookieChoiceDismiss">Got it</button></div>
<!-- FALLBACK MANUEL (facultatif) : la page lit d'abord data/packages.json, genere automatiquement par scripts/build_site_data.py. Le JSON ci-dessous ne sert que si ce fichier est introuvable (ex. ouverture locale). Meme format : un paquet = une entree, avec toutes ses versions dedans.
La version la plus recente (par date) est affichee en haut de la page du paquet ; les autres vont dans l'historique.
"deb" = lien direct GitHub vers le .deb. Dans le JSON, ecris < sous la forme \u003c.
Champs de version facultatifs (arch, size en octets, installedSize, depends, compatibility, priority, md5, sha256) ; depends/compatibility/priority peuvent aussi etre au niveau du paquet.
Exemple :
[{"id":"com.exemple.tweak","name":"Nom","icon":"icons/tweak.png","author":"Moi","section":"Tweaks","description":"Texte","depiction":"https://exemple.com (facultatif)","added":"2026-11-01T14:00:00Z","free":true,"versions":[{"version":"1.0.0","date":"2026-11-01T14:00:00Z","deb":"https://github.com/raphetsoso/repo/releases/download/v1.0.0/tweak.deb","arch":"iphoneos-arm64","size":96266,"installedSize":586,"depends":"mobilesubstrate","compatibility":"iOS 15+","priority":"optional","md5":"","sha256":""}]}]
-->
<script type="application/json" id="repo-data">[]</script>
<script>
(function(){
  var REPO_URL="https://raphetsoso.github.io/repo/"; /* put your real repo URL here */
  var label=document.getElementById("copyLabel"),btn=document.getElementById("copyRepo"),timer;
  label.textContent=REPO_URL;
  document.getElementById("sileo").href="sileo://source/"+REPO_URL;
  document.getElementById("zebra").href="zbra://sources/add/"+REPO_URL;
  function done(){
    label.innerHTML='<span class="irucon irucon-check"></span> Copied';
    clearTimeout(timer);timer=setTimeout(function(){label.textContent=REPO_URL;},1600);
  }
  function fallback(){
    var t=document.createElement("textarea");t.value=REPO_URL;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(t);done();
  }
  function copyRepo(){
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(REPO_URL).then(done,fallback);}else{fallback();}
  }
  btn.addEventListener("click",copyRepo);
  var rss=document.getElementById("copyRss"),rssTimer;
  rss.addEventListener("click",function(e){
    e.preventDefault();
    copyRepo();
    rss.title="Copied";
    clearTimeout(rssTimer);rssTimer=setTimeout(function(){rss.title="Copy repo URL";},1600);
  });

  /* ---------- data ---------- */
  var DATA=[];
  function ts(v){var t=new Date(v).getTime();return isNaN(t)?0:t;}
  function prepare(list){
    list=(Array.isArray(list)?list:[]).filter(function(p){return p&&p.id&&p.versions&&p.versions.length;});
    list.forEach(function(p){p.versions=p.versions.slice().sort(function(a,b){return ts(b.date)-ts(a.date);});});
    list.sort(function(a,b){return ts(b.versions[0].date)-ts(a.versions[0].date);});
    return list;
  }
  function archLabel(a){return {"iphoneos-arm64":"iOS Rootless","iphoneos-arm":"iOS"}[a]||a;}
  function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function fmtDay(v){var d=new Date(v);return isNaN(d)?"":d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}
  function fmtDate(v){var d=new Date(v);return isNaN(d)?"":d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+" "+fmtDay(v);}
  function fmtSize(b){return b?(b/1024).toFixed(2)+" Kb":"";}
  function pick(p,v,k){return v[k]!=null&&v[k]!==""?v[k]:p[k];}
  function href(p){return "#/package/"+encodeURIComponent(p.id);}

  /* ---------- home list ---------- */
  var results=document.getElementById("results"),empty=document.getElementById("empty"),emptyText=document.getElementById("emptyText");
  function renderList(){
    var html="",day="",open=false;
    DATA.forEach(function(p){
      var v=p.versions[0],d=fmtDay(v.date);
      if(d!==day){
        if(open)html+="</div></div></div>";
        html+='<div class="day"><div class="row"><div class="col-xs-12"><h2 class="text-left lead"><span class="irucon irucon-info"></span> '+esc(d)+'</h2></div></div><div class="row"><div class="list-group media">';
        day=d;open=true;
      }
      var q=[p.name,p.id,p.author,p.section,p.description].join(" ").toLowerCase();
      html+='<a href="'+href(p)+'" data-q="'+esc(q)+'" class="list-group-item media text-left col-xs-12 col-sm-6 col-md-4 packages"><span class="pull-left"><img width="60" height="60" class="media-object img-rounded" src="'+esc(p.icon||"")+'" alt="'+esc(p.name)+'" onerror="this.style.visibility=\'hidden\'"></span><div class="media-body"><h3 class="h4 media-heading"><span class="ellipsis mw75">'+esc(p.name)+'</span> <small>'+esc(v.version)+'</small></h3><p class="mtr5"><span class="label label-primary">'+(p.versions.length===1?"New":"Update")+'</span></p>'+(p.section?'<p class="mtr5"><span class="ellipsis mw75"><span class="irucon irucon-list"></span> '+esc(p.section)+'</span></p>':'')+'</div></a>';
    });
    if(open)html+="</div></div></div>";
    results.innerHTML=html;
    if(!DATA.length){emptyText.textContent="No packages yet.";empty.style.display="";}
  }
  var s=document.getElementById("s"),detail=document.getElementById("detail"),home=document.getElementById("home");
  document.getElementById("searchForm").addEventListener("submit",function(e){e.preventDefault();});
  s.addEventListener("input",function(){
    if(!detail.hidden){location.hash="";}
    var t=s.value.trim().toLowerCase(),n=0;
    var rows=results.querySelectorAll(".packages");
    rows.forEach(function(r){var ok=(r.getAttribute("data-q")||"").indexOf(t)>-1;r.style.display=ok?"":"none";if(ok)n++;});
    results.querySelectorAll(".day").forEach(function(d){
      var any=false;d.querySelectorAll(".packages").forEach(function(r){if(r.style.display!=="none")any=true;});
      d.style.display=any?"":"none";
    });
    emptyText.textContent=DATA.length?"No result.":"No packages yet.";
    empty.style.display=n?"none":"";
  });

  /* ---------- package page (same file, #/package/<id>) ---------- */
  function li(k,val,cls){if(val==null||val==="")return "";return '<li class="list-group-item'+(cls?" "+cls:"")+'"><b>'+k+'</b> '+esc(val)+'</li>';}
  function renderDetail(p){
    var v=p.versions[0],oldest=p.versions[p.versions.length-1];
    var info='<li class="list-group-item breakword"><b>Identifier</b> '+esc(p.id)+'</li>'
      +li("Added Date",fmtDate(p.added||oldest.date))
      +li("Updated Date",fmtDate(v.date))
      +(p.free===false?"":'<li class="list-group-item"><b>Free package</b></li>')
      +'<li class="list-group-item"><b>Repository</b> <a href="#">raphetsoso\'s repository</a></li>'
      +li("Author",p.author)+li("Section",p.section)+li("Version",v.version)
      +li("Architecture",archLabel(pick(p,v,"arch")))+li("Size",fmtSize(v.size))+li("Installed-Size",pick(p,v,"installedSize"))
      +li("Depends",pick(p,v,"depends"),"breakword")+li("Priority",pick(p,v,"priority"))+li("Compatibility",pick(p,v,"compatibility"));
    var hist=p.versions.map(function(x,k){
      var meta=[];
      if(x.arch)meta.push("<b>Architecture</b> "+esc(archLabel(x.arch)));
      if(x.md5)meta.push("<b>MD5</b> "+esc(x.md5));
      if(x.sha256)meta.push("<b>SHA256</b> "+esc(x.sha256));
      return '<li class="list-group-item'+(k>=5?" hidden":"")+'">'+(x.deb?'<a rel="nofollow" href="'+esc(x.deb)+'">Download '+esc(p.name)+' version '+esc(x.version)+'</a>':'<b>'+esc(p.name)+' version '+esc(x.version)+'</b>')+' <span class="label label-primary">'+esc(fmtDate(x.date))+'</span>'+(meta.length?'<br><small class="breakword">'+meta.join("<br>")+'</small>':'')+'</li>';
    }).join("");
    if(p.versions.length>5)hist+='<li class="list-group-item text-center"><a href="#" id="moreVersions" rel="nofollow">Show more previous versions</a></li>';
    return '<h1 class="text-center">'+(p.icon?'<img class="img-rounded" src="'+esc(p.icon)+'" alt="Icon" width="60" height="60" onerror="this.style.display=\'none\'"> ':'')+'<span class="breakword">'+esc(p.name)+'</span></h1>'
      +'<div class="row lead"><div class="col-lg-5"><h2 class="text-center">Informations</h2><ul class="text-center list-group">'+info+'</ul></div>'
      +'<div class="col-lg-7"><h2 class="text-center">Description</h2>'+(p.description?'<p class="text-center breakword">'+esc(p.description)+'</p>':'')
      +(p.depiction?'<p class="text-center"><a target="_blank" href="'+esc(p.depiction)+'" class="btn btn-default btn-block" rel="nofollow noopener">Depiction</a></p>':'')
      +'<hr><h2 class="text-center">Version History</h2><ul class="list-group">'+hist+'</ul></div></div>';
  }
  var baseTitle=document.title;
  function route(){
    var m=/^#\/package\/(.+)$/.exec(location.hash),p=null;
    if(m){var id;try{id=decodeURIComponent(m[1]);}catch(e){id=m[1];}p=DATA.filter(function(x){return x.id===id;})[0]||null;}
    if(p){
      detail.innerHTML=renderDetail(p);home.hidden=true;detail.hidden=false;
      document.title=p.name+" - raphetsoso's repository";window.scrollTo(0,0);
    }else{
      detail.hidden=true;detail.innerHTML="";home.hidden=false;document.title=baseTitle;
    }
  }
  detail.addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("#moreVersions");if(!a)return;
    e.preventDefault();
    detail.querySelectorAll("li.hidden").forEach(function(x){x.classList.remove("hidden");});
    a.parentNode.parentNode.removeChild(a.parentNode);
  });
  window.addEventListener("hashchange",route);
  function boot(list){DATA=prepare(list);renderList();route();}
  var embedded=[];
  try{embedded=JSON.parse(document.getElementById("repo-data").textContent)||[];}catch(e){embedded=[];}
  if(window.fetch){
    fetch("data/packages.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(boot).catch(function(){boot(embedded);});
  }else{boot(embedded);}
  document.getElementById("cookieChoiceDismiss").addEventListener("click",function(){
    var c=document.getElementById("cookieChoiceInfo");c.parentNode.removeChild(c);
  });
})();
</script>
</body>
</html>
