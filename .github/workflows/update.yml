name: Update repo
on:
  schedule: [{ cron: "*/30 * * * *" }]   # toutes les 30 min
  workflow_dispatch:                      # bouton manuel
  repository_dispatch:
    types: [tweak-released]               # declenchement instantane
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Fetch latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs data
          echo '[]' > data/tweaks.json
          for repo in $(jq -r '.[].repo' data/sources.json); do
            if ! rel=$(gh api repos/$repo/releases/latest 2>/dev/null); then
              echo "::warning::Aucune release publiee trouvee pour $repo (brouillon, pre-release ou repo prive ?)"
              continue
            fi
            gh release download --repo $repo --pattern '*.deb' --dir debs --clobber \
              || echo "::warning::Aucun .deb attache a la release de $repo"
            jq --arg repo "$repo" --argjson r "$rel" \
              '. + [{repo:$repo, version:($r.tag_name|ltrimstr("v")), date:$r.published_at, url:$r.html_url}]' \
              data/tweaks.json > /tmp/t.json && mv /tmp/t.json data/tweaks.json
          done

      - name: Build site data (packages.json + icons)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site_data.py

      - name: Build index + Release
        env:
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          touch .nojekyll   # GitHub Pages sert les fichiers tels quels (sans Jekyll)
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -f Packages
          bzip2 -k -f Packages

          NAME="$OWNER's repo"

          # Icone du repo pour Sileo/Zebra/Cydia (meme logo que la topbar et le favicon du site)
          # Si icon.png n'existe pas a la racine, on prend automatiquement la premiere icone de tweak
          if [ ! -f icon.png ]; then
            first="$(ls icons/*.png 2>/dev/null | head -n 1)"
            if [ -n "$first" ]; then
              cp -f "$first" icon.png
            else
              echo "::warning::Aucun icon.png a la racine et aucune icone dans icons/ : pas de logo pour le repo"
            fi
          fi
          [ -f icon.png ] && cp -f icon.png CydiaIcon.png

          VERSION="$(date -u +%Y.%m.%d).$RUN_NUMBER"
          ARCHS="$(grep -h '^Architecture:' Packages | cut -d' ' -f2 | sort -u | tr '\n' ' ' | sed 's/ $//')"
          [ -z "$ARCHS" ] && ARCHS="iphoneos-arm iphoneos-arm64"

          {
            echo "Origin: $NAME"
            echo "Label: $NAME"
            echo "Suite: stable"
            echo "Version: $VERSION"
            echo "Codename: ios"
            echo "Architectures: $ARCHS"
            echo "Components: main"
            echo "Description: $NAME"
            echo "Date: $(date -Ru)"
            echo "MD5Sum:"
            for f in Packages Packages.gz Packages.bz2; do
              echo " $(md5sum $f | cut -d' ' -f1) $(stat -c%s $f) $f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz Packages.bz2; do
              echo " $(sha256sum $f | cut -d' ' -f1) $(stat -c%s $f) $f"
            done
          } > Release

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update from releases" && git push)
